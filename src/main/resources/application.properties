# Relay server configuration
spring.application.name=buzz-relay
server.port=3000

# MySQL datasource
spring.datasource.url=jdbc:mysql://localhost:3306/relay?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1994cheche
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Redis (local, no password)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.timeout=5s

# MyBatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.default-fetch-size=100

# Auto-init schema on startup
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# ACP relay configuration
relay.ws-path=/ws
relay.replay-limit=200
relay.history-limit=20
relay.heartbeat-interval-seconds=5
